<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Лізуня</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.5rem;
      padding: 1.5rem;
      box-sizing: border-box;
      background: #1a0b14;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #fdeef5;
    }
    h1 {
      font-size: clamp(1.8rem, 6.5vw, 5rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
      text-align: center;
      max-width: 14ch;
      margin: 0;
      animation: pulse 3s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    #stars {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }
    h1, #music { position: relative; z-index: 1; }
    .star {
      position: absolute;
      color: #ffd9ec;
      animation: twinkle var(--dur) ease-in-out infinite;
      animation-delay: var(--delay);
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.15; transform: scale(0.8); }
      50%      { opacity: 1;    transform: scale(1.2); }
    }
    #music {
      padding: 0.85rem 1.6rem;
      font-size: 1.05rem;
      color: #fdeef5;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    #music:hover { background: rgba(255, 255, 255, 0.14); }
    #music:active { transform: scale(0.96); }
  </style>
</head>
<body>
  <div id="stars"></div>
  <h1>Лізуня, ти найкраща в світі, я тебе люблю ❤️</h1>
  <button id="music">💖 Увімкнути мелодію</button>

  <script>
    // Багато зірочок ✨
    (function () {
      const box = document.getElementById('stars');
      const glyphs = ['✦', '✧', '⋆', '✩', '·', '✨'];
      const count = 140;
      let html = '';
      for (let i = 0; i < count; i++) {
        const top = (Math.random() * 100).toFixed(2);
        const left = (Math.random() * 100).toFixed(2);
        const size = (0.5 + Math.random() * 1.6).toFixed(2);
        const dur = (1.8 + Math.random() * 3).toFixed(2);
        const delay = (Math.random() * 4).toFixed(2);
        const g = glyphs[i % glyphs.length];
        html += `<span class="star" style="top:${top}%;left:${left}%;font-size:${size}rem;--dur:${dur}s;--delay:${delay}s">${g}</span>`;
      }
      box.innerHTML = html;
    })();
  </script>

  <script>
    // Ноти (Гц)
    const N = {
      C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392.00,
      A4: 440.00, B4: 493.88, C5: 523.25, D5: 587.33, E5: 659.25
    };

    // Ніжна романтична мелодія — [нота, тривалість у долях]
    const MELODY = [
      ['E4',1],['G4',1],['A4',2],['G4',1],['E4',1],['D4',2],
      ['C4',1],['E4',1],['G4',2],['A4',1],['G4',1],['E4',2],
      ['D4',1],['F4',1],['A4',2],['G4',1],['F4',1],['E4',2],
      ['C4',1],['D4',1],['E4',2],['G4',1],['E4',1],['C4',2]
    ];

    const BEAT = 0.55;
    const btn = document.getElementById('music');
    let ctx = null, master = null, timer = null, playing = false;

    function playNote(freq, start, dur) {
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      const peak = 0.16;
      g.gain.setValueAtTime(0.0001, start);
      g.gain.exponentialRampToValueAtTime(peak, start + 0.07);
      g.gain.exponentialRampToValueAtTime(0.0001, start + dur * 0.95);
      osc.connect(g).connect(master);
      osc.start(start);
      osc.stop(start + dur);
    }

    function scheduleLoop() {
      let t = ctx.currentTime + 0.15;
      for (const [note, beats] of MELODY) {
        const dur = beats * BEAT;
        playNote(N[note], t, dur);
        t += dur;
      }
      const total = (t - ctx.currentTime) * 1000;
      timer = setTimeout(scheduleLoop, total - 50);
    }

    function start() {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain();
      master.gain.value = 0.9;
      master.connect(ctx.destination);
      scheduleLoop();
      playing = true;
      btn.textContent = '⏸ Вимкнути мелодію';
    }

    function stop() {
      clearTimeout(timer);
      if (ctx) ctx.close();
      ctx = null;
      playing = false;
      btn.textContent = '💖 Увімкнути мелодію';
    }

    btn.addEventListener('click', () => playing ? stop() : start());
  </script>
</body>
</html>
